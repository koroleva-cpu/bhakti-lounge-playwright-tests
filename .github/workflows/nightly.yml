name: Nightly regression

on:
  schedule:
    - cron: "15 18 * * 1-5"
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: playwright install --with-deps chromium
      - run: pytest -m "not learning" --browser chromium --numprocesses 3
        env:
          BASE_URL: https://www.bhaktilounge.org.nz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-test-results
          path: test-results/
          retention-days: 14
